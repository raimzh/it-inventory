# Общий набор заголовков безопасности.
# Подключается через include в каждом location, где есть свои add_header:
# nginx наследует add_header только при полном их отсутствии на текущем уровне.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# X-XSS-Protection намеренно не выставляется: устаревший заголовок, в современных
# браузерах игнорируется, а в старых сам по себе создавал уязвимости. Его роль
# выполняет CSP ниже.
#
# camera=(self) — на странице инвентаризации работает сканер QR-кодов (html5-qrcode).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
