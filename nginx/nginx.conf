worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 50M;

  # Не раскрывать версию nginx в заголовках и на страницах ошибок
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1000;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
  # 429 понятнее для клиента, чем дефолтный 503
  limit_req_status 429;

  upstream backend {
    server backend:3001;
  }

  upstream frontend {
    server frontend:3000;
  }

  # ── Заголовки безопасности ────────────────────────────────────────────────
  # ВАЖНО: nginx наследует add_header только если на текущем уровне нет своих
  # add_header. Поэтому набор вынесен в файл и подключается в КАЖДОМ location,
  # где объявлены собственные заголовки (иначе они молча пропадают).
  #
  # CSP допускает 'unsafe-inline'/'unsafe-eval' для скриптов: Next.js
  # использует инлайновые скрипты гидратации, а nonce требует генерации на
  # каждый запрос. Это осознанный компромисс, а не упущение.

  server {
    listen 80;
    server_name _;

    # Для production с сертификатами — раскомментировать редирект и блок 443 ниже
    # return 301 https://$host$request_uri;

    include /etc/nginx/security-headers.conf;

    # API routes
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://backend/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 300s;
    }

    # Auth rate limiting
    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://backend/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health-check бэкенда — без rate limit, чтобы мониторинг не упирался в лимит
    location /api/health {
      access_log off;
      proxy_pass http://backend/health;
      proxy_set_header Host $host;
    }

    # Static uploads
    location /uploads/ {
      alias /app/uploads/;
      expires 30d;
      # Свои add_header ниже отменяют наследование — подключаем набор заново.
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, immutable" always;
      # Файлы пользователей не должны исполняться как HTML в браузере
      add_header Content-Disposition "attachment" always;
    }

    # Frontend
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ── HTTPS ──────────────────────────────────────────────────────────────────
  # Блок закомментирован намеренно: без файлов сертификатов nginx не стартует.
  # Порядок включения:
  #   1) положить fullchain.pem и privkey.pem в ./nginx/certs/
  #   2) заменить server_name на реальный домен
  #   3) раскомментировать этот блок и редирект в server{listen 80}
  # HSTS включён только здесь: по HTTP браузеры его игнорируют, а после
  # перехода на HTTPS он запрещает откат на незащищённое соединение.
  #
  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name inventory.yourdomain.com;
  #
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  #   ssl_prefer_server_ciphers off;
  #   ssl_session_cache   shared:SSL:10m;
  #   ssl_session_timeout 1d;
  #   ssl_stapling        on;
  #   ssl_stapling_verify on;
  #
  #   include /etc/nginx/security-headers.conf;
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #
  #   location /api/ {
  #     limit_req zone=api burst=50 nodelay;
  #     proxy_pass http://backend/;
  #     proxy_http_version 1.1;
  #     proxy_set_header Upgrade $http_upgrade;
  #     proxy_set_header Connection 'upgrade';
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #     proxy_read_timeout 300s;
  #   }
  #
  #   location /api/auth/ {
  #     limit_req zone=auth burst=10 nodelay;
  #     proxy_pass http://backend/auth/;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   }
  #
  #   location /uploads/ {
  #     alias /app/uploads/;
  #     expires 30d;
  #     include /etc/nginx/security-headers.conf;
  #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #     add_header Cache-Control "public, immutable" always;
  #     add_header Content-Disposition "attachment" always;
  #   }
  #
  #   location / {
  #     proxy_pass http://frontend;
  #     proxy_http_version 1.1;
  #     proxy_set_header Upgrade $http_upgrade;
  #     proxy_set_header Connection 'upgrade';
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #     proxy_cache_bypass $http_upgrade;
  #   }
  # }
}
